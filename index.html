  <title>Oráculo Bilionário</title>

      padding: 1rem 2rem;
      background-color: #00ff88;
      color: #111;
      border: none;
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;

<body>
  <div class="container">
    <h1>Ative o Oráculo Bilionário</h1>
    <p>Descubra quanto você pode lucrar agora...</p>
    <div id="money">R$ 0,00</div>
    <button class="btn" onclick="startOraculo()">Ativar</button>
    <button id="btnSacar" class="btn hidden" onclick="window.location.href='https://seulink.com'">Sacar agora</button>
  </div>

  <script>
    let valor = 0;
    let intervalo;

    function formatar(valor) {
      return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function startOraculo() {
      document.querySelector(".btn").disabled = true;
      intervalo = setInterval(() => {
        valor += Math.floor(Math.random() * 50) + 20;
        document.getElementById("money").innerText = formatar(valor);
        if (valor >= 500) {
          clearInterval(intervalo);
          document.getElementById("money").innerText = 'R$ 500,00';
          document.getElementById("btnSacar").classList.remove("hidden");
        }
      }, 300);
    }
  </script>
</body>
</html>

DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oráculo Bilionário</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      text-align: center;
      padding: 50px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: #111;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px red;
    }
    button {
      background-color: red;
      color: white;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Descubra quanto o Oráculo Bilionário revela para você...</h1>
    <p id="mensagem">Clique no botão abaixo para começar!</p>
    <button id="botao">Começar</button>
  </div>

  <script>
    const mensagens = [
      "Você ganhou R$20!",
      "Mais R$50 para sua conta...",
      "Uau! R$80 ganhos!",
      "Mais R$150... tá ficando bom!",
      "Última rodada... prepare-se!",
      "Parabéns! Você ganhou R$500!"
    ];

    const botao = document.getElementById("botao");
    const mensagem = document.getElementById("mensagem");
    let etapa = 0;

    botao.addEventListener("click", () => {
      if (etapa < mensagens.length - 1) {
        mensagem.textContent = mensagens[etapa];
        etapa++;
        botao.textContent = "Continuar";
      } else {
        mensagem.textContent = mensagens[etapa];
        botao.textContent = "Resgatar Agora";
        botao.onclick = () => {
          window.location.href = "https://seulink.com"; // depois você coloca o link real aqui
        };
      }
    });
  </script>
</body>
</html>
